# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pull Request
on: pull_request

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  ###################################################
  # BUILD
  ###################################################

  build:
    name: Build (${{ matrix.os }})
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (net8.0, net9.0)
        uses: actions/setup-dotnet@v5
        with:
          cache: 'nuget'
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v5
        with:
          cache: 'nuget'

      - name: Restore
        shell: bash
        run: |
          dotnet tool restore
          dotnet restore src/Spectre.Console.slnx --locked-mode

      - name: Build
        shell: bash
        run: |
          dotnet make

      - name: Upload Verify Test Results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: verify-test-results-${{ matrix.os }}
          path: |
            **/*.received.*